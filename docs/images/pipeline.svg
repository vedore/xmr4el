<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330">
<title>XMR4EL pipeline: read a mention with its context, encode it, embed and cluster the labels, train a matcher per tree node, predict by beam search</title>
