[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xmr4el", "xmr4el.*"]

[project]
name = "xmr4el"
version = "0.5.3"
description = "eXtreme Multi-Label Ranking for Entity Linking"
authors = [
  { name="João Vedor", email="fc56311@alunos.fc.ul.pt" }
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "threadpoolctl",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "transformers",
  "sentence-transformers",
  "huggingface-hub",

  "torch>=2.13.0"
]

# Linux: CUDA 12.6 build (PyPI's Linux torch 2.14 is CUDA 13, driver >= 580; the server has 570)
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["F", "E9"]  # pyflakes + syntax errors (CI); style rules are not enforced
